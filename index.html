</style></head><body><div class='app'><header><div class='top'><button id='back' class='back'>‹</button><h1 id='title'>我的日志</h1></div><div id='datebar' class='datebar'><button id='prev'>‹</button><input id='date' type='date'><button id='next'>›</button></div></header><main id='content' class='page'></main><div id='composer' class='composer'><textarea id='quick' class='auto-grow'></textarea><button id='add' class='primary'>添加</button></div><div id='modal' class='modal'><div class='modal-panel'><div id='modalTitle' class='modal-title'></div><div id='modalHelp' class='modal-help'></div><textarea id='modalText'></textarea><div class='modal-actions'><button id='modalCancel' class='btn'>取消</button><button id='modalSave' class='primary'>保存</button></div></div></div><input id='importFile' class='file-input' type='file' accept='application/json,.json'></div><script>
const sections=[['work','工作记录','🧩'],['life','生活时间线','🕰️'],['body','身体状态','🌿'],['issues','问题与分支','🧷'],['feelings','喜欢与不喜欢','♡'],['writing','写作与阅读摘记','✍️'],['habits','提醒与打卡','✓']];let current=null,day=new Date().toISOString().slice(0,10);const $=x=>document.getElementById(x),K=x=>'j2_'+x,L=(x,d=[])=>JSON.parse(localStorage.getItem(K(x))||JSON.stringify(d)),S=(x,v)=>localStorage.setItem(K(x),JSON.stringify(v)),E=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),T=()=>new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
const autoGrow=(el,maxRows=10)=>{if(!el)return;el.classList.add('auto-grow');const resize=()=>{el.style.height='auto';const cs=getComputedStyle(el),lh=parseFloat(cs.lineHeight)||24,pad=(parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0),max=lh*maxRows+pad;el.style.height=Math.min(el.scrollHeight,max)+'px';el.style.overflowY=el.scrollHeight>max?'auto':'hidden'};el.addEventListener('input',resize);requestAnimationFrame(resize)};
let modalAction=null;function openModal(title,help,value,onSave){$('modalTitle').textContent=title;$('modalHelp').textContent=help||'';$('modalText').value=value||'';modalAction=onSave;$('modal').classList.add('show');autoGrow($('modalText'),12);setTimeout(()=>$('modalText').focus(),30)}

function backupStatus(){const last=L('lastBackup',''),today=new Date().toISOString().slice(0,10);if(!last)return `<div class='backup-status backup-warning'>还没有导出过备份。</div>`;const same=last.slice(0,10)===today;return `<div class='backup-status ${same?'backup-ok':'backup-warning'}'>最近备份：${E(last)}${same?' · 今天已备份':' · 今天还没备份'}</div>`}
function home(){current=null;$('title').textContent='我的日志';$('back').style.display='none';$('datebar').style.display='none';$('composer').style.display='none';$('content').innerHTML=`<div class='tip'>点进一个入口，就是今天那一页。</div><div class='list'>${sections.map(([id,n,i])=>{let p='还没有记录';if(id==='issues'){const a=L(id).filter(x=>x.status!=='done');p=a.length?`${a.length} 条未处理`:'没有未处理问题'}else{const a=L(id).filter(x=>x.date===day);if(a.length)p=a.at(-1).title||a.at(-1).text||'已有记录'}return `<div class='row' data-id='${id}'><div class='icon'>${i}</div><div class='grow'><div class='ttl'>${n}</div><div class='preview'>${E(p)}</div></div><div class='arrow'>›</div></div>`}).join('')}</div><div class='card backup-card'><b>备份与恢复</b><div class='tip' style='margin-top:6px'>每天导出一次。清除缓存、换浏览器或更新文件后，可以从备份恢复。</div><div class='actions'><button class='primary' onclick='exportBackup()'>导出今天的备份</button><button class='btn' onclick='chooseImport()'>导入备份</button></div>${backupStatus()}</div>`;document.querySelectorAll('.row').forEach(r=>r.onclick=()=>open(r.dataset.id))}

function exportBackup(){
  const data={version:1,exportedAt:new Date().toISOString(),items:{}};
  for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(key&&key.startsWith('j2_')) data.items[key]=localStorage.getItem(key);
  }
  const now=new Date(),pad=n=>String(n).padStart(2,'0');
  const stamp=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=`我的日志备份_${stamp}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  S('lastBackup',`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`);
  home();
}
function chooseImport(){$('importFile').value='';$('importFile').click()}
$('importFile').onchange=async e=>{
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    const raw=await file.text(),data=JSON.parse(raw);
    if(!data||typeof data.items!=='object')throw new Error('格式不正确');
    if(!confirm('导入会覆盖当前日志数据。确定继续吗？'))return;
    Object.keys(localStorage).filter(k=>k.startsWith('j2_')).forEach(k=>localStorage.removeItem(k));
    for(const [k,v] of Object.entries(data.items))if(k.startsWith('j2_'))localStorage.setItem(k,v);
    alert('备份已恢复。');home();
  }catch(err){alert('无法导入这个备份文件：'+err.message)}
};

function open(id){current=id;$('title').textContent=sections.find(x=>x[0]===id)[1];$('back').style.display='block';$('datebar').style.display=id==='issues'?'none':'flex';$('composer').style.display=['work','life','feelings'].includes(id)?'flex':'none';$('date').value=day;$('quick').placeholder=id==='work'?'先写要做的工作……':id==='life'?'先写这一段生活……':'写一条喜欢或不喜欢……';render();if(['work','life','feelings'].includes(id))autoGrow($('quick'),6)}
$('back').onclick=home;$('prev').onclick=()=>shift(-1);$('next').onclick=()=>{if(day<new Date().toISOString().slice(0,10))shift(1)};$('date').onchange=e=>{day=e.target.value;render()};function shift(n){const d=new Date(day+'T12:00:00');d.setDate(d.getDate()+n);day=d.toISOString().slice(0,10);$('date').value=day;render()}
$('add').onclick=()=>{const t=$('quick').value.trim();if(!t)return;const a=L(current);if(['work','life'].includes(current)){if(a.find(x=>x.date===day&&!x.end)){alert('上一项还在进行中，请先结束。');return}a.push({id:Date.now(),date:day,title:t,start:T(),end:'',finish:'',note:''})}else a.push({id:Date.now(),date:day,text:t,type:'neutral'});S(current,a);$('quick').value='';render()};
function render(){({work:timeline,life:timeline,body:bodyPage,issues:issuesPage,feelings:feelingsPage,writing:writingPage,habits:habitsPage}[current]||(()=>{}))(current)}
function timeline(kind){const a=L(kind).filter(x=>x.date===day);$('content').innerHTML=a.length?a.map(x=>`<div class='card timeline'><div class='times'>${x.start}${x.end?`<br>—<br>${x.end}`:''}</div><div><div style='display:flex;justify-content:space-between;gap:8px'><b>${E(x.title)}</b>${x.end?'':"<span class='running'>● 进行中</span>"}</div>${x.finish?`<div class='body' style='margin-top:6px'>${E(x.finish)}</div>`:''}<div class='actions'>${x.end?'':`<button class='btn' onclick="finish('${kind}',${x.id})">结束</button>`}<button class='btn' onclick='toggle(${x.id})'>批注</button></div><div id='n${x.id}' class='note'><textarea id='nt${x.id}' class='auto-grow' style='width:100%;min-height:130px'>${E(x.note||'')}</textarea><button class='primary' style='margin-top:7px' onclick="saveNote('${kind}',${x.id})">保存</button></div></div></div>`).join(''):`<div class='empty'>这一天还没有记录。</div>`;document.querySelectorAll('.note textarea').forEach(x=>autoGrow(x,8))}
window.finish=(k,id)=>{const a=L(k),x=a.find(v=>v.id===id);openModal('结束补记','结果、感觉或想到的事都可以。',x.finish||'',r=>{x.end=T();x.finish=r.trim();S(k,a);render()})};window.toggle=id=>$('n'+id).classList.toggle('show');window.saveNote=(k,id)=>{const a=L(k),x=a.find(v=>v.id===id);x.note=$('nt'+id).value;S(k,a);render()};
function feelingsPage(){const a=L('feelings').filter(x=>x.date===day);$('content').innerHTML=a.length?a.map(x=>`<div class='card ${x.type==='like'?'pink':x.type==='dislike'?'blue':''}'><div class='body'>${E(x.text)}</div><div class='actions'><button class='pill ${x.type==='like'?'active':''}' onclick="feel(${x.id},'like')">喜欢</button><button class='pill ${x.type==='dislike'?'active':''}' onclick="feel(${x.id},'dislike')">不喜欢</button></div></div>`).join(''):`<div class='empty'>今天还没有写下感受。</div>`}window.feel=(id,t)=>{const a=L('feelings'),x=a.find(v=>v.id===id);x.type=x.type===t?'neutral':t;S('feelings',a);render()};
function issuesPage(){const a=L('issues'),o=a.filter(x=>x.status!=='done'),d=a.filter(x=>x.status==='done');$('content').innerHTML=`<div class='card'><div class='field'><label>新增问题或分支</label><textarea id='it' class='auto-grow'></textarea></div><div class='field'><label>所属项目（可选）</label><input id='ip'></div><button class='primary' onclick='addIssue()'>添加</button></div><div class='section'>未闭环 · ${o.length}</div>${o.map(issue).join('')||"<div class='empty'>没有悬着的问题。</div>"}<div class='section'>已解决 · ${d.length}</div>${d.map(issue).join('')}`;autoGrow($('it'),10)}
function issue(x){return `<div class='card'><b>${E(x.text)}</b><div class='issue-meta'>${x.project?`<span class='project-tag'>${E(x.project)}</span>`:''}<span class='meta'>${x.created}</span></div><div class='actions'>${[['todo','待处理'],['doing','处理中'],['hold','暂不处理'],['done','已解决']].map(([s,n])=>`<button class='status ${s}' onclick="setIssue(${x.id},'${s}')">${n}</button>`).join('')}</div>${x.result?`<div class='note show'>${E(x.result)}</div>`:''}<button class='btn' style='margin-top:8px' onclick='result(${x.id})'>补处理结果</button></div>`}window.addIssue=()=>{const t=$('it').value.trim();if(!t)return;const a=L('issues');a.push({id:Date.now(),text:t,project:$('ip').value.trim(),created:new Date().toLocaleDateString('zh-CN'),status:'todo',result:''});S('issues',a);render()};window.setIssue=(id,s)=>{const a=L('issues'),x=a.find(v=>v.id===id);x.status=s;S('issues',a);render()};window.result=id=>{const a=L('issues'),x=a.find(v=>v.id===id);openModal('处理结果','处理过程、结论或后续安排都可以写在这里。',x.result||'',r=>{x.result=r.trim();S('issues',a);render()})};
function writingPage(){const a=L('writing').filter(x=>x.date===day);$('content').innerHTML=`<div class='card'><div class='field'><label>聊天对象</label><div class='actions' id='ais'>${['DeepSeek','ChatGPT','Claude','Gemini','其他'].map(n=>`<button class='pill' data-ai='${n}'>${n}</button>`).join('')}</div></div><div class='field'><label>聊天标题</label><input id='ct'></div><div class='field'><label>关键词或小标题</label><input id='wt'></div><div class='field'><label>摘记正文</label><textarea id='wb' class='auto-grow'></textarea></div><div class='field'><label>类型</label><select id='wtype'><option>人物</option><option>情节</option><option>语言</option><option>阅读</option><option>其他</option></select></div><button class='primary' onclick='addWriting()'>保存摘记</button></div><div class='section'>当天摘记</div>${a.map(x=>{const long=(x.body||'').length>180||(x.body||'').split('\n').length>6;return `<div class='card'><b>${E(x.title||'未命名')}</b>${x.chatTitle?`<div class='chat-title'>${E(x.chatTitle)}</div>`:''}<div class='writing-meta'><span class='meta'>${E(x.ai)}</span><span class='type-tag'>${E(x.type)}</span></div><div id='wb${x.id}' class='body writing-body ${long?'collapsed':''}' style='margin-top:9px'>${E(x.body)}</div>${long?`<button class='toggle-text' onclick='toggleWriting(${x.id},this)'>展开全文</button>`:''}</div>`}).join('')||"<div class='empty'>这一天还没有摘记。</div>"}`;let ai=L('lastAI','ChatGPT');document.querySelectorAll('[data-ai]').forEach(b=>{b.classList.toggle('active',b.dataset.ai===ai);b.onclick=()=>{ai=b.dataset.ai;S('lastAI',ai);document.querySelectorAll('[data-ai]').forEach(x=>x.classList.toggle('active',x.dataset.ai===ai))}});window.ai=()=>ai;autoGrow($('wb'),10)}window.toggleWriting=(id,b)=>{const el=$('wb'+id),collapsed=el.classList.toggle('collapsed');b.textContent=collapsed?'展开全文':'收起'};
window.addWriting=()=>{const b=$('wb').value.trim();if(!b)return;const a=L('writing');a.push({id:Date.now(),date:day,ai:window.ai(),chatTitle:$('ct').value.trim(),title:$('wt').value.trim(),body:b,type:$('wtype').value});S('writing',a);render()};
function bodyPage(){const p=L('body').filter(x=>x.date===day);$('content').innerHTML=`<div class='chart'><canvas id='cv' width='680' height='260'></canvas></div><div class='card'><div class='range'><span>-5</span><input id='rng' type='range' min='-5' max='5' step='1' value='0'><span id='rv'>0</span></div><div class='field'><label>时间</label><input id='bt' type='time' value='${T()}'></div><div class='field'><label>原因或说明（可选）</label><textarea id='bn'></textarea></div><button class='primary' onclick='addBody()'>记录状态</button></div><div class='section'>当天落点</div>${p.map(x=>`<div class='card'><b>${x.time}</b><span class='value-badge'>${x.value>0?'+':''}${x.value}</span>${x.note?`<div class='body' style='margin-top:8px'>${E(x.note)}</div>`:''}</div>`).join('')}`;$('rng').oninput=e=>$('rv').textContent=e.target.value;draw(p)}window.addBody=()=>{const a=L('body');a.push({id:Date.now(),date:day,time:$('bt').value,value:+$('rng').value,note:$('bn').value.trim()});S('body',a);render()};function draw(p){const c=$('cv'),x=c.getContext('2d'),w=c.width,h=c.height,l=42,r=15,t=15,b=28;x.clearRect(0,0,w,h);x.font='11px sans-serif';for(let v=-5;v<=5;v++){const y=t+(5-v)/10*(h-t-b);x.strokeStyle='#ddd';x.beginPath();x.moveTo(l,y);x.lineTo(w-r,y);x.stroke();x.fillStyle='#777';x.fillText(v>0?'+'+v:v,8,y+4)}const q=p.slice().sort((a,b)=>a.time.localeCompare(b.time));if(q.length){x.strokeStyle='#526bd7';x.lineWidth=2;x.beginPath();q.forEach((p,i)=>{const [hh,mm]=p.time.split(':').map(Number),xx=l+(hh*60+mm)/1440*(w-l-r),yy=t+(5-p.value)/10*(h-t-b);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke();q.forEach(p=>{const [hh,mm]=p.time.split(':').map(Number),xx=l+(hh*60+mm)/1440*(w-l-r),yy=t+(5-p.value)/10*(h-t-b);x.fillStyle='#222';x.beginPath();x.arc(xx,yy,4,0,Math.PI*2);x.fill()})}}
function habitsPage(){const k='habits_'+day,d=L(k,{checks:{},water:0,drink:0,exercise:[],chores:[{name:'拖地',cycle:5,last:''},{name:'换床单',cycle:25,last:''}]});$('content').innerHTML=`<div class='section'>每日习惯</div><div class='card'>${['开窗','扫地','11点前睡觉','正常排便'].map(n=>`<div class='habit'><span>${n}</span><button class='pill ${d.checks[n]?'active':''}' onclick="habit('${n}')">${d.checks[n]?'完成':'未做'}</button></div>`).join('')}</div><div class='section'>计量项目</div><div class='card'><div class='habit'><span>喝水</span><div class='dots'>${[1,2,3,4].map(i=>`<button class='${d.water>=i?'on':''}' onclick='water(${i})'></button>`).join('')}</div></div><div class='habit'><span>饮料</span><button class='pill' onclick='drink()'>${d.drink} 杯</button></div></div><div class='section'>运动记录</div><div class='card'><div class='field'><select id='ex'><option>游泳</option><option>遛弯</option><option>瑜伽垫运动</option><option>骑车</option><option>其他</option></select></div><div class='field'><input id='ev' placeholder='40 分钟 / 8 公里 / 5200 步'></div><button class='primary' onclick='exercise()'>添加</button>${d.exercise.length?`<div class='exercise-list'>${d.exercise.map(x=>`<div class='exercise-item'><div class='exercise-type'>${E(x.type)}</div><div class='exercise-value'>${E(x.value)}</div></div>`).join('')}</div>`:''}</div><div class='section'>周期家务</div><div class='card'>${d.chores.map((x,i)=>`<div class='habit'><span>${E(x.name)} · 每 ${x.cycle} 天</span><button class='pill' onclick='chore(${i})'>${x.last?'上次 '+x.last:'标记完成'}</button></div>`).join('')}</div>`;window.hd=d;window.hk=k}function saveH(){S(window.hk,window.hd);render()}window.habit=n=>{window.hd.checks[n]=!window.hd.checks[n];saveH()};window.water=i=>{window.hd.water=window.hd.water===i?i-1:i;saveH()};window.drink=()=>{const v=prompt('今天喝了几杯饮料？',window.hd.drink);if(v===null)return;window.hd.drink=+v||0;saveH()};window.exercise=()=>{const v=$('ev').value.trim();if(!v)return;window.hd.exercise.push({type:$('ex').value,value:v});saveH()};window.chore=i=>{window.hd.chores[i].last=day;saveH()};home();
</script></body></html>
